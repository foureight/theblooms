# THE BLOOMS — Zerops project import
# Vložte do: Zerops Dashboard → Import a project
# Docs: https://docs.zerops.io/references/import
#
# Po importu:
# 1. Ve službě `app` → Pipelines & CI/CD napojte Git (větev main, setup `app`)
# 2. Nastavte silné heslo ADMIN_PASSWORD
# 3. Přidejte vlastní doménu / public HTTP access
# 4. Zkontrolujte NEXT_PUBLIC_SITE_URL
#
# Pokud máte veřejné GitHub/GitLab repo, můžete místo kroku 1 odkomentovat
# buildFromGit + zeropsSetup níže a build spustí hned při importu.

project:
  name: theblooms
  tags:
    - production
    - theblooms

services:
  # Persistentní úložiště pro CMS (cms.json) + nahrané fotky
  - hostname: vol
    type: local-storage:single@1
    priority: 10
    verticalAutoscaling:
      minDisk: 5
      maxDisk: 10

  # Next.js SSR app (pipeline napojíte po importu v GUI)
  - hostname: app
    type: nodejs@22
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1
    priority: 1
    # Odcomentujte jen když máte veřejné GitHub/GitLab repo:
    # buildFromGit: https://github.com/ORG/REPO
    # zeropsSetup: app
    envSecrets:
      ADMIN_PASSWORD: zmente-toto-heslo
      ADMIN_SECRET: <@generateRandomString(<48>)>
      CAPTCHA_SECRET: <@generateRandomString(<48>)>
    envVariables:
      NODE_ENV: production
      UPLOADS_DIR: /srv/uploads
      NEXT_PUBLIC_SITE_URL: https://theblooms.cz
      NEXT_PUBLIC_TYPEKIT_ID: zwe5oqo
