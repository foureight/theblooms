# THE BLOOMS — Next.js SSR na Zerops (build/run pipeline)
# Docs: https://docs.zerops.io/zerops-yaml/specification
# Import infrastruktury: zerops-import.yml (Local Storage `vol` + Node.js `app`)
zerops:
  - setup: app
    build:
      base: nodejs@22
      buildCommands:
        - npm ci
        - npm run build
      deployFiles: ./
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      volume:
        hostname: vol
        mountPath: /srv/uploads
      envVariables:
        NODE_ENV: production
        NEXT_PUBLIC_SITE_URL: https://theblooms.cz
        NEXT_PUBLIC_TYPEKIT_ID: zwe5oqo
        UPLOADS_DIR: /srv/uploads
      start: npm run start
      healthCheck:
        httpGet:
          port: 3000
          path: /
