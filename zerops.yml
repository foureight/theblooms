# THE BLOOMS — Next.js SSR na Zerops (build/run pipeline)
# Docs: https://docs.zerops.io/zerops-yaml/specification
# Import infrastruktury: zerops-import.yml (Local Storage `vol` + Node.js `app`)
#
# NEXT_PUBLIC_* patří do build.envVariables — Next.js je vloží do client bundle
# při `npm run build`. (Dříve byly jen pod run — to pro widget nestačí spolehlivě.)
#
# Packeta:
#   NEXT_PUBLIC_PACKETA_API_KEY — veřejný widget klíč (build + ideálně i run)
#   PACKETA_API_PASSWORD        — API heslo jako Secret ve službě app (jen runtime)
zerops:
  - setup: app
    build:
      base: nodejs@22
      envVariables:
        NEXT_PUBLIC_SITE_URL: https://theblooms.cz
        NEXT_PUBLIC_TYPEKIT_ID: zwe5oqo
        # Stejný způsob jako SITE_URL / TYPEKIT. Doplňte widget klíč z Packeta
        # (klientská sekce), nebo nastavte stejnojmennou env ve Zerops GUI před buildem.
        NEXT_PUBLIC_PACKETA_API_KEY: ""
      buildCommands:
        - npm ci
        - npm run build
      deployFiles: ./
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      volume:
        hostname: vol
        mountPath: /srv/uploads
      envVariables:
        NODE_ENV: production
        NEXT_PUBLIC_SITE_URL: https://theblooms.cz
        NEXT_PUBLIC_TYPEKIT_ID: zwe5oqo
        NEXT_PUBLIC_PACKETA_API_KEY: ""
        UPLOADS_DIR: /srv/uploads
        PACKETA_SENDER_ID: "578009"
        PACKETA_ESHOP: theblooms
        PACKETA_HOME_CARRIER_ID: "106"
        # PACKETA_API_PASSWORD nastavte jako Secret ve službě app
      start: npm run start
      healthCheck:
        httpGet:
          port: 3000
          path: /
